services:
  # 1. Database (PostgreSQL) - 공식 이미지 사용
  postgres:
    image: postgres:13
    container_name: mlops_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Object Storage (RustFS) - S3 호환 오브젝트 스토리지 (Apache-2.0)
  #    MinIO 커뮤니티 에디션 단종(2025-10 이미지 배포 중단, 2026-04 레포 아카이브)으로 교체
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    container_name: mlops_rustfs
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOG_DIRECTORY: ""   # 로그를 stdout으로 (docker logs 로 확인)
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # RustFS는 UID 10001로 실행되므로 호스트 폴더 대신 named volume 사용 (권한 문제 방지)
      - rustfs_data:/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 버킷 초기화 (1회성). 별도 클라이언트 이미지 없이 RustFS 이미지의 curl(SigV4 서명)을 사용
  rustfs-init:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    container_name: mlops_rustfs_init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      MLFLOW_BUCKET_NAME: ${MLFLOW_BUCKET_NAME:-mlflow-artifacts}
      DATASET_BUCKET_NAME: ${DATASET_BUCKET_NAME:-datasets}
    networks:
      - mlops-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        S3=http://rustfs:9000
        s3() {
          curl -sS -o /dev/null -w '%{http_code}' \
            --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" \
            -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" "$$@"
        }
        check() { case "$$1" in 2??) echo "  OK ($$1)";; *) echo "  FAILED (HTTP $$1)"; exit 1;; esac; }

        for b in "$$MLFLOW_BUCKET_NAME" "$$DATASET_BUCKET_NAME"; do
          echo "버킷 생성: $$b"
          check "$$(s3 -X PUT "$$S3/$$b")"
        done

        # 데이터셋 버킷은 익명 다운로드 허용 (기존 'mc anonymous set download' 와 동일)
        echo "익명 다운로드 정책 적용: $$DATASET_BUCKET_NAME"
        check "$$(s3 -X PUT "$$S3/$$DATASET_BUCKET_NAME?policy" -H 'Content-Type: application/json' \
          --data "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$DATASET_BUCKET_NAME/*\"]}]}")"

        echo 'RustFS 초기화 완료'

  # 3. MLflow Server (커스텀 이미지)
  mlflow:
    image: ghcr.io/codevisionx/covi-kitech-mlops-mlflow:latest
    container_name: mlops_mlflow
    restart: always
    depends_on:
      - postgres
      - rustfs
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS:-mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,172.*,192.168.*}
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - mlops-net

  # 4. FastAPI Backend (커스텀 이미지)
  backend:
    image: ghcr.io/codevisionx/covi-kitech-mlops-backend:latest
    container_name: mlops_backend
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      - POSTGRES_DB=${POSTGRES_DB}
      - MAX_DEPLOYMENTS_PER_PROJECT=${MAX_DEPLOYMENTS_PER_PROJECT}
      - TRAINING_IMAGE=${TRAINING_IMAGE}
      - TRAINING_IMAGE_YOLO26=${TRAINING_IMAGE_YOLO26:-ghcr.io/codevisionx/covi-kitech-mlops-training-yolo26:latest}
      - TRAINING_IMAGE_PPOCR=${TRAINING_IMAGE_PPOCR:-ghcr.io/codevisionx/covi-kitech-mlops-training-ppocr:latest}
      - DATASET_BUCKET_NAME=${DATASET_BUCKET_NAME:-datasets}
      - S3_PUBLIC_PORT=${S3_PORT:-9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-}
      - S3_CORS_ALLOWED_ORIGINS=${S3_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - training_results:/app/runs
      - bentoml_model_store:/root/.bentoml
    networks:
      - mlops-net
    depends_on:
      mlflow:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  
  # 5. BentoML Tools (커스텀 이미지)
  builder-image:
    image: ghcr.io/codevisionx/covi-kitech-mlops-builder:latest
    profiles: ["tools"]

  base-image:
    image: ghcr.io/codevisionx/covi-kitech-mlops-base:latest
    profiles: ["tools"]

  # 6-1. 신규 학습 이미지 (백엔드가 작업마다 직접 실행, 여기서는 pull 용)
  training-yolo26-image:
    image: ${TRAINING_IMAGE_YOLO26:-ghcr.io/codevisionx/covi-kitech-mlops-training-yolo26:latest}
    profiles: ["tools"]

  training-ppocr-image:
    image: ${TRAINING_IMAGE_PPOCR:-ghcr.io/codevisionx/covi-kitech-mlops-training-ppocr:latest}
    profiles: ["tools"]

  # 6. Training Worker (커스텀 이미지)
  training:
    image: ${TRAINING_IMAGE:-ghcr.io/codevisionx/covi-kitech-mlops-training:latest}
    container_name: mlops_training
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
    volumes:
      - training_results:/app/runs 
    networks:
      - mlops-net
    profiles: ["job"]
  
  jupyter:
    image: ghcr.io/codevisionx/covi-kitech-mlops-jupyter:latest
    container_name: mlops_jupyter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - training_results:/app/runs
    networks:
      - mlops-net

  # 7. Angular Frontend (커스텀 이미지)
  ui:
    image: ghcr.io/codevisionx/covi-kitech-mlops-ui:latest
    container_name: mlops_ui
    restart: always
    ports:
      - "${UI_PORT}:80"
    networks:
      - mlops-net
    depends_on:
      - backend

networks:
  mlops-net:
    name: mlops-net
    driver: bridge

volumes:
  rustfs_data:
    name: mlops_rustfs_data
  training_results:
    name: mlops_kitech_training_results
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/training_results
  bentoml_model_store:
    name: mlops_bentoml_model_store