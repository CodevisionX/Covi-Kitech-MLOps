services:
  # 1. Database (PostgreSQL) - 공식 이미지 사용
  postgres:
    image: postgres:13
    container_name: mlops_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Object Storage (MinIO) - 공식 이미지 사용
  minio:
    image: minio/minio
    container_name: mlops-minio
    restart: always
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./minio_data:/data
    networks:
      - mlops-net

  # 3. MLflow Server (커스텀 이미지)
  mlflow:
    image: ghcr.io/abi-hong/covi-mlops-kitech-mlflow:latest
    container_name: mlops_mlflow
    restart: always
    depends_on:
      - postgres
      - minio
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --host 0.0.0.0
      --port 5000
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - mlops-net

  # 4. FastAPI Backend (커스텀 이미지)
  backend:
    image: ghcr.io/abi-hong/covi-mlops-kitech-backend:latest
    container_name: mlops_backend
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MAX_DEPLOYMENTS_PER_PROJECT=${MAX_DEPLOYMENTS_PER_PROJECT}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - training_results:/app/runs
      - bentoml_model_store:/root/.bentoml
    networks:
      - mlops-net
    depends_on:
      mlflow:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
  
  # 5. BentoML Tools (커스텀 이미지)
  builder-image:
    image: ghcr.io/abi-hong/covi-mlops-kitech-builder:latest
    profiles: ["tools"]

  base-image:
    image: ghcr.io/abi-hong/covi-mlops-kitech-base:latest
    profiles: ["tools"]

  # 6. Training Worker (커스텀 이미지)
  training:
    image: ghcr.io/abi-hong/covi-mlops-kitech-training:latest
    container_name: mlops_training
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - training_results:/app/runs 
    networks:
      - mlops-net
    profiles: ["job"]

  # 7. Angular Frontend (커스텀 이미지)
  ui:
    image: ghcr.io/abi-hong/covi-mlops-kitech-ui:latest
    container_name: mlops_ui
    restart: always
    ports:
      - "${UI_PORT}:80"
    networks:
      - mlops-net
    depends_on:
      - backend

networks:
  mlops-net:
    name: mlops-net
    driver: bridge

volumes:
  training_results:
    name: mlops_kitech_training_results
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/training_results
  bentoml_model_store:
    name: mlops_bentoml_model_store