[tool.poetry]
name = "mlops-training-worker"
version = "0.1.0"
description = "YOLO & EfficientNet Training Environment"
authors = ["Hong Hee-soo"]

[tool.poetry.dependencies]
python = "^3.10"
ultralytics = "8.3.0"
mlflow = "2.14.0"
bentoml = "1.2.0"
boto3 = "^1.34.0"
psycopg2-binary = "^2.9.9"
pandas = "^2.0.0"
opencv-python-headless = "^4.8.0"
python-dotenv = "^1.0.0"

# ML 관련 의존성
[tool.poetry.group.ml.dependencies]
torch = { version = ">=2.6.0", source = "pytorch_cpu" }
torchvision = { version = ">=0.21.0", source = "pytorch_cpu" }

# 소스 설정
[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"