[tool.poetry]
name = "mlops-training-worker"
version = "0.1.0"
description = "YOLO & EfficientNet Training Environment"
authors = ["Hong Hee-soo"]

[tool.poetry.dependencies]
python = "^3.10"
ultralytics = "8.3.0"
mlflow = "2.14.0"
bentoml = "1.2.0"
boto3 = "^1.34.0"
psycopg2-binary = "^2.9.9"
pandas = "^2.0.0"
opencv-python-headless = "^4.8.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.ml.dependencies]
torch = "2.9.1"
torchvision = "0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"