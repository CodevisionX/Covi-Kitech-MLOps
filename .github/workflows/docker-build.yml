name: Build and Push All MLOps Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: backend
            context: ./api
            dockerfile: ./api/Dockerfile.backend
            image_suffix: backend
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'api/**'
                - '!api/Dockerfile.builder'
                - '!api/Dockerfile.base'
                - '!api/deploy_worker.py'
                - '!api/service.py'
          - service_name: training
            context: ./training
            dockerfile: ./training/Dockerfile
            image_suffix: training
            tag_suffix: "latest"
            filter_pattern: |
              src:
                # paths-filter v2 는 패턴을 OR 로 묶으므로 '!' 제외 대신 기존 이미지 파일을 직접 나열
                - 'training/Dockerfile'
                - 'training/pyproject.toml'
                - 'training/poetry.lock'
                - 'training/train_yolo.py'
                - 'training/train_cnn.py'
                - 'training/utils.py'
          # 신규 학습 이미지 (기본 CUDA 빌드 cu126 = 고객 배포 GPU 기준)
          - service_name: training-yolo26
            context: ./training
            dockerfile: ./training/yolo26/Dockerfile
            image_suffix: training-yolo26
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'training/yolo26/**'
                - 'training/utils.py'
                - 'training/mlops_common.py'
                - 'training/dataset_tools.py'
                - 'training/validate_dataset.py'
                - 'training/evaluate_e2e.py'
                - 'training/import_model.py'
          - service_name: training-ppocr
            context: ./training
            dockerfile: ./training/ppocr/Dockerfile
            image_suffix: training-ppocr
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'training/ppocr/**'
                - 'training/utils.py'
                - 'training/mlops_common.py'
                - 'training/dataset_tools.py'
                - 'training/validate_dataset.py'
                - 'training/evaluate_e2e.py'
                - 'training/import_model.py'
          - service_name: jupyter
            context: ./jupyter
            dockerfile: ./jupyter/Dockerfile.jupyter
            image_suffix: jupyter
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'jupyter/**'
          - service_name: ui
            context: ./ui
            dockerfile: ./ui/Dockerfile
            image_suffix: ui
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'ui/**'
          - service_name: mlflow
            context: ./mlflow
            dockerfile: ./mlflow/Dockerfile
            image_suffix: mlflow
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'mlflow/**'
          - service_name: builder
            context: ./api
            dockerfile: ./api/Dockerfile.builder
            image_suffix: builder
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'api/Dockerfile.builder'
                - 'api/deploy_worker.py'
                - 'api/pyproject.toml'
          - service_name: base
            context: ./api
            dockerfile: ./api/Dockerfile.base
            image_suffix: base
            tag_suffix: "latest"
            filter_pattern: |
              src:
                - 'api/Dockerfile.base'
                - 'api/service.py'
                - 'api/pyproject.toml'

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: ${{ matrix.filter_pattern }}
      
      # 1. QEMU 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-${{ matrix.image_suffix }}:${{ matrix.tag_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max