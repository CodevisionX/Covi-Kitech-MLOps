name: Build and Push All MLOps Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: backend
            context: ./api
            dockerfile: ./api/Dockerfile.backend
            image_suffix: backend
            filter_pattern: |
              src:
                - 'api/**'
                - '!api/Dockerfile.builder'
                - '!api/Dockerfile.base'
                - '!api/deploy_worker.py'
                - '!api/service.py'
          - service_name: ui
            context: ./ui
            dockerfile: ./ui/Dockerfile
            image_suffix: ui
            filter_pattern: |
              src:
                - 'ui/**'
          - service_name: training
            context: ./training
            dockerfile: ./training/Dockerfile
            image_suffix: training
            filter_pattern: |
              src:
                - 'training/**'
          - service_name: mlflow
            context: ./mlflow
            dockerfile: ./mlflow/Dockerfile
            image_suffix: mlflow
            filter_pattern: |
              src:
                - 'mlflow/**'
          - service_name: builder
            context: ./api
            dockerfile: ./api/Dockerfile.builder
            image_suffix: builder
            filter_pattern: |
              src:
                - 'api/Dockerfile.builder'
                - 'api/deploy_worker.py'
                - 'api/pyproject.toml'
          - service_name: base
            context: ./api
            dockerfile: ./api/Dockerfile.base
            image_suffix: base
            filter_pattern: |
              src:
                - 'api/Dockerfile.base'
                - 'api/service.py'
                - 'api/pyproject.toml'

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: ${{ matrix.filter_pattern }}
      
      # 1. QEMU 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-${{ matrix.image_suffix }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max