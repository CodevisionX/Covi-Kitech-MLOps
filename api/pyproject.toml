[tool.poetry]
name = "my-mlops-project"
version = "0.1.0"
description = "FastAPI and MLOps Platform"
authors = ["Hong Hee-soo <your@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.109.0"
uvicorn = {extras = ["standard"], version = "0.27.0"}
python-multipart = "0.0.6"
docker = "7.1.0"
requests = "2.31.0"
urllib3 = "1.26.20"
boto3 = "1.34.0"
mlflow = "2.14.0"
python-dotenv = "1.0.0"
bentoml = "1.2.0"
ultralytics = "8.2.0"
pillow = "^10.0.0"
pydantic-settings = "^2.1.0"
aiofiles = "^23.2.1"
sqlalchemy = "2.0.25"
psycopg2-binary = "^2.9.9"
prometheus-client = "^0.19.0"

# PyTorch CUDA 설정을 위한 별도 소스 및 의존성 정의
torch = {version = "2.3.1", source = "pytorch-gpu-src"}
torchvision = {version = "0.18.1", source = "pytorch-gpu-src"}

[[tool.poetry.source]]
name = "pytorch-gpu-src"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"