services:
  # 인프라 서비스 (Postgres, RustFS, MLflow 등은 기존과 동일)
  postgres:
    image: postgres:13
    container_name: mlops_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # 2. Object Storage (RustFS) - S3 호환 오브젝트 스토리지 (Apache-2.0)
  #    MinIO 커뮤니티 에디션 단종(2025-10 이미지 배포 중단, 2026-04 레포 아카이브)으로 교체
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    container_name: mlops_rustfs
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOG_DIRECTORY: ""   # 로그를 stdout으로 (docker logs 로 확인)
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # RustFS는 UID 10001로 실행되므로 호스트 폴더 대신 named volume 사용 (권한 문제 방지)
      - rustfs_data:/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 버킷 초기화 (1회성). 별도 클라이언트 이미지 없이 RustFS 이미지의 curl(SigV4 서명)을 사용
  rustfs-init:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    container_name: mlops_rustfs_init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      MLFLOW_BUCKET_NAME: ${MLFLOW_BUCKET_NAME:-mlflow-artifacts}
      DATASET_BUCKET_NAME: ${DATASET_BUCKET_NAME:-datasets}
    networks:
      - mlops-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        S3=http://rustfs:9000
        s3() {
          curl -sS -o /dev/null -w '%{http_code}' \
            --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" \
            -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" "$$@"
        }
        check() { case "$$1" in 2??) echo "  OK ($$1)";; *) echo "  FAILED (HTTP $$1)"; exit 1;; esac; }

        for b in "$$MLFLOW_BUCKET_NAME" "$$DATASET_BUCKET_NAME"; do
          echo "버킷 생성: $$b"
          check "$$(s3 -X PUT "$$S3/$$b")"
        done

        # 데이터셋 버킷 익명 접근 해제. 예전 버전이 걸어 둔 공개 다운로드 정책이 있으면 지웁니다.
        # 학습/검사 작업은 모두 접속 키로 받으므로 공개 정책이 필요 없습니다. (정책이 없으면 404)
        echo "익명 접근 정책 제거: $$DATASET_BUCKET_NAME"
        code="$$(s3 -X DELETE "$$S3/$$DATASET_BUCKET_NAME?policy")"
        case "$$code" in 404) echo "  OK (정책 없음)";; *) check "$$code";; esac

        echo 'RustFS 초기화 완료'

  mlflow:
    build: ./mlflow
    container_name: mlops_mlflow
    depends_on:
      - postgres
      - rustfs
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS:-mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,172.*,192.168.*}
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - mlops-net

  # 5. FastAPI Backend (개발 모드 세팅)
  backend:
    image: mlops-backend:latest
    user: root
    build:
      context: ./api
      dockerfile: Dockerfile.backend
    container_name: mlops_backend
    restart: always
    environment:
      # - DOCKER_HOST=tcp://host.docker.internal:2375
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      - AWS_DEFAULT_REGION=us-east-1
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      - POSTGRES_DB=${POSTGRES_DB}
      - PYTHONUNBUFFERED=1  # 로그 실시간 확인을 위해 권장
      - MAX_DEPLOYMENTS_PER_PROJECT=${MAX_DEPLOYMENTS_PER_PROJECT}
      - TRAINING_IMAGE=${TRAINING_IMAGE}
      - TRAINING_IMAGE_YOLO26=${TRAINING_IMAGE_YOLO26:-mlops-training-yolo26:latest}
      - TRAINING_IMAGE_PPOCR=${TRAINING_IMAGE_PPOCR:-mlops-training-ppocr:latest}
      - DATASET_BUCKET_NAME=${DATASET_BUCKET_NAME:-datasets}
      - S3_PUBLIC_PORT=${S3_PORT:-9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-}
      - S3_CORS_ALLOWED_ORIGINS=${S3_CORS_ALLOWED_ORIGINS:-*}
      - SERVING_IMAGE=${SERVING_IMAGE}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app:z          # 로컬 코드 동기화
      - /var/run/docker.sock:/var/run/docker.sock
      - training_results:/app/runs
      - bentoml_model_store:/root/.bentoml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - mlops-net
    depends_on:
      mlflow:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  builder-image:
    build:
      context: ./api
      dockerfile: Dockerfile.builder
    image: mlops-builder:latest
    profiles: ["tools"] # docker-compose up 할 때 자동으로 뜨지 않음

  base-image:
    build:
      context: ./api
      dockerfile: Dockerfile.base
    image: bentoml-generic-server:latest
    profiles: ["tools"]
  
  # 6-1. 신규 학습 이미지 (백엔드가 작업마다 직접 실행, 여기서는 빌드용)
  # CUDA 빌드: 고객 배포 GPU(RTX A4000)는 cu126, Blackwell(RTX 50xx) 개발 PC는
  # YOLO26=cu130 / PP-OCR=cu129 (torchvision cu129 빌드에는 sm_120 NMS 커널이 없음)
  training-yolo26-image:
    build:
      context: ./training
      dockerfile: yolo26/Dockerfile
      args:
        CUDA_FLAVOR: ${TRAINING_CUDA_FLAVOR_YOLO26:-cu126}
    image: ${TRAINING_IMAGE_YOLO26:-mlops-training-yolo26:latest}
    profiles: ["tools"]

  training-ppocr-image:
    build:
      context: ./training
      dockerfile: ppocr/Dockerfile
      args:
        CUDA_FLAVOR: ${TRAINING_CUDA_FLAVOR_PPOCR:-cu126}
    image: ${TRAINING_IMAGE_PPOCR:-mlops-training-ppocr:latest}
    profiles: ["tools"]

  # 6. Training Worker
  training:
    build:
      context: ./training
      dockerfile: Dockerfile
    image: mlops-training:latest
    container_name: mlops_training
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ./training:/app             
      - training_results:/app/runs
      - /app/.venv
    command: sh -c "python train_yolo.py 2>&1 | tee /app/runs/$$(hostname).log"
    networks:
      - mlops-net
    profiles: ["job"] # 여전히 프로파일을 설정해서 평소엔 안 켜지게 함

  # 7. Angular Frontend (Hot Reload용 수정본)
  ui:
    # Build 대신 Node 이미지를 직접 사용합니다. (개발 전용)
    image: node:20-alpine
    container_name: mlops_ui
    working_dir: /app            # 명령어가 실행될 작업 디렉토리 설정
    ports:
      - "4200:4200"
    volumes:
      - ./ui:/app                 # 로컬 소스 코드 동기화
      - /app/node_modules         # 도커 내부의 라이브러리 보호
    # 컨테이너가 뜨자마자 실행할 명령어
    command: sh -c "npm install && npx ng serve --configuration docker --host 0.0.0.0 --poll 2000"
    networks:
      - mlops-net
    depends_on:
      - backend

  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile.jupyter
    container_name: mlops_jupyter
    user: root
    shm_size: '8gb' 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:?.env 에 S3_ACCESS_KEY 를 설정하세요}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:?.env 에 S3_SECRET_KEY 를 설정하세요}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work   # 노트북 파일 로컬 동기화
      - training_results:/app/runs      # 학습 결과물 볼륨 공유
    networks:
      - mlops-net
    depends_on:
      - mlflow
      - rustfs

networks:
  mlops-net:
    name: mlops-net
    driver: bridge

volumes:
  rustfs_data:
    name: mlops_rustfs_data
  training_results:
    name: mlops_kitech_training_results
    external: false
  bentoml_model_store:
    name: mlops_bentoml_model_store
    external: false