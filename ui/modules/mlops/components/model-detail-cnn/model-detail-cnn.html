<app-run-detail-view [runId]="runId()" [runInfo]="runInfo()" [projectId]="projectId()"
  [startedAt]="getRelativeTime(runInfo()?.start_time)" [isDeploying]="isDeploying()" variantFallback="1D-CNN"
  [chartOptions]="chartOptions" lossTitle="손실 함수 (Loss Trend)" [lossChart]="lossChartData()"
  imagesTitle="시각화 분석 결과"
  [images]="[
    { tag: 'Learning Curves', tagClass: 'label', url: learningCurveUrl(), alt: 'Learning Curves' },
    { tag: 'Sensor Samples', tagClass: 'pred', url: sensorSampleUrl(), alt: 'Sensor Samples' }
  ]" (back)="goBack()" (deploy)="onDeployModel()" (imageError)="onImgError($event)"></app-run-detail-view>
