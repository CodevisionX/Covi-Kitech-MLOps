<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <div class="branding">
    <img src="assets/logo.svg" alt="KITECH Logo" class="logo-img">
    <span class="logo-text">교육용 MLOps 플랫폼</span>
  </div>
</mat-toolbar>

<mat-sidenav-container class="main-container" [style.height]="layoutService.getBodyHeight()">
  <mat-sidenav #sidenav mode="side" opened class="side-nav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>model_training</mat-icon>
        <span matListItemTitle>학습 실행</span>
      </a>
      <a mat-list-item routerLink="/dashboard/models" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>학습 이력</span>
      </a>
      <a mat-list-item routerLink="/dashboard/deployments" routerLinkActive="active-link">
        <mat-icon matListItemIcon>rocket_launch</mat-icon>
        <span matListItemTitle>배포 현황</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
