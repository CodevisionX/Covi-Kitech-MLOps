<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>🚀 KITECH MLOps Platform</span>
</mat-toolbar>

<mat-sidenav-container class="main-container" [style.height]="layoutService.getBodyHeight()">
  <mat-sidenav #sidenav mode="side" opened class="side-nav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>model_training</mat-icon>
        <span matListItemTitle>Training</span>
      </a>
      <a mat-list-item routerLink="/model-list" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Model Registry</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-terminal></app-terminal>
