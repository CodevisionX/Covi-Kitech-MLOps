<div class="dataset-container">
  <header class="dataset-header">
    <div class="title-group">
      <mat-icon style="color: var(--main-primary-color)">storage</mat-icon>
      <h1>데이터 세트 브라우저</h1>
    </div>
    <p class="subtitle">MinIO 저장소에서 학습에 사용할 데이터셋 폴더를 탐색하고 선택합니다.</p>
  </header>

  <div class="explorer-card">
    <div class="explorer-info">
      <mat-icon>info</mat-icon>
      <span>학습에 사용할 이미지가 포함된 <strong>최종 폴더</strong>를 클릭하여 선택하세요.</span>
    </div>

    <cdk-tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor" class="dataset-tree">
      <cdk-nested-tree-node *cdkTreeNodeDef="let node" class="tree-node">
        <div class="node-content" 
             [class.active-node]="modelService.selectedDatasetPath() === (node.bucket + '/' + node.fullPath)"
             (click)="onNodeClick(node)">
          <button mat-icon-button disabled class="toggle-placeholder"></button>
          <mat-icon class="node-icon file">insert_drive_file</mat-icon>
          <span class="node-label">{{node.name}}</span>
        </div>
      </cdk-nested-tree-node>

      <cdk-nested-tree-node *cdkTreeNodeDef="let node; when: hasChild" class="tree-node">
        <div class="node-content" 
             [class.active-node]="modelService.selectedDatasetPath() === (node.bucket + '/' + node.fullPath)"
             (click)="onNodeClick(node)">
          
          <button mat-icon-button cdkTreeNodeToggle (click)="$event.stopPropagation()" class="toggle-btn">
            <mat-icon class="toggle-icon">
              {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
            </mat-icon>
          </button>

          <mat-icon class="node-icon" [ngClass]="node.type" [style.color]="node.type === 'bucket' ? 'var(--warning-color)' : 'var(--main-primary-color)'">
            {{ node.type === 'bucket' ? 'database' : 'folder' }}
          </mat-icon>
          
          <span class="node-label">{{node.name}}</span>
          
          @if (node.isLoading) {
            <mat-progress-spinner diameter="16" mode="indeterminate" class="node-spinner"></mat-progress-spinner>
          }
        </div>

        @if (tree.isExpanded(node)) {
          <div class="children-group" role="group">
            <ng-container cdkTreeNodeOutlet></ng-container>
          </div>
        }
      </cdk-nested-tree-node>
    </cdk-tree>
  </div>
</div>
