server {
    listen 80;
    server_name localhost;

    client_max_body_size 500M;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 모든 API 요청 (projects, jobs 등 일반 요청)
    location /api/ {
        # 백엔드 주소 뒤에 /를 붙이면, location의 /api/ 부분이 제거되고 
        # 그 뒤의 경로만 백엔드로 전달됩니다.
        proxy_pass http://backend:8000/api/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 실시간 로그 스트리밍을 위한 특별 설정 (jobs/stream 전용)
    location /api/v1/jobs/stream {
        proxy_pass http://backend:8000/api/v1/jobs/stream;
        
        # 스트리밍을 위한 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;      # 버퍼링 끄기
        proxy_cache off;          # 캐시 끄기
        chunked_transfer_encoding on;
        
        proxy_read_timeout 86400s; # 긴 연결 유지

        client_max_body_size 0;
    }
}