services:
  # 1. Database (PostgreSQL) - MLflow의 메타데이터 저장용
  postgres:
    image: postgres:13
    container_name: mlops_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Object Storage (MinIO) - 데이터셋 및 모델 아티팩트 저장용
  minio:
    image: minio/minio
    container_name: mlops-minio
    restart: always
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./minio_data:/data
    networks:
      - mlops-net

  # 3. Model Registry (MLflow Server)
  mlflow:
    build: ./mlflow
    container_name: mlops_mlflow
    restart: always
    depends_on:
      - postgres
      - minio
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/
      --host 0.0.0.0
      --port 5000
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - mlops-net
  
  # 5. FastAPI Backend
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.backend
    container_name: mlops_backend
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MAX_DEPLOYMENTS_PER_PROJECT=${MAX_DEPLOYMENTS_PER_PROJECT}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./training_results:/app/runs
      - bentoml_model_store:/root/.bentoml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - mlops-net
    depends_on:
      mlflow:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
  
  builder-image:
    image: mlops-builder:latest
    profiles: ["tools"]

  base-image:
    image: bentoml-generic-server:latest
    profiles: ["tools"]
  
  # 6. Training Worker (프로파일 설정으로 수동 실행)
  training:
    build: ./training
    container_name: mlops_training
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./training_results:/app/runs
    networks:
      - mlops-net
    profiles: ["job"]

  # 7. Angular Frontend (추가된 부분)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile # 운영용 멀티 스테이지 빌드 Dockerfile 필요
    container_name: mlops_ui
    restart: always
    ports:
      - "80:80" # 브라우저에서 http://localhost 로 접속
    networks:
      - mlops-net
    depends_on:
      - backend

networks:
  mlops-net:
    name: mlops-net
    driver: bridge

volumes:
  training_results:
    name: mlops_kitech_training_results
  bentoml_model_store:
    name: mlops_bentoml_model_store